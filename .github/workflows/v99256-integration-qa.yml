name: V992.56 integration QA

on:
  push:
    branches:
      - integration/v99256-upstream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-regressions:
    name: Proven HOME and asset regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: find launcher -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run V992.56 and incremental integration tests
        run: node --test tests/*.test.cjs
      - name: Confirm no unreviewed modifications to original HOME and artwork
        run: node --test tests/reference_integrity.test.cjs
