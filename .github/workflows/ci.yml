name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test for a release
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - run: python tools/build_home_query.py
      - run: python tools/build_home_control.py
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check compiled launcher release packaging
        run: python tools/build_release.py launcher --reviewed-artwork --output dist/release-check
      - name: Check public artwork redistribution boundary
        run: python tools/check_artwork_release.py dist/release-check/*.wgt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-launcher-unsigned
          path: dist/release-check/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: settings-browser-failures
          path: test-results/
          retention-days: 7

  windows-home:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - run: python tools/build_home_query.py
      - run: python tools/build_home_control.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_releases.py tests/test_home.py tests/test_home_control.py
      - run: node --test tests/home_store.test.cjs
